name: Release Obsidian plugin

on:
  push:
    branches:
      - main
    tags:
      - '*'

permissions:
  contents: write

jobs:
  ensure-tag:
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_created: ${{ steps.push-tag.outputs.tag_created }}

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'

      - name: Read version
        id: version
        run: |
          version=$(node -p "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8')).version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create version tag when missing
        id: push-tag
        run: |
          git fetch --force --tags

          version="${{ steps.version.outputs.version }}"

          if git show-ref --tags --verify --quiet "refs/tags/$version"; then
            echo "Tag $version already exists."
            echo "tag_created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag "$version"
          git push origin "$version"
          echo "tag_created=true" >> "$GITHUB_OUTPUT"

  build:
    if: startsWith(github.ref, 'refs/tags/') || (startsWith(github.ref, 'refs/heads/') && needs.ensure-tag.outputs.tag_created == 'true')
    needs:
      - ensure-tag
    runs-on: ubuntu-latest

    env:
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || needs.ensure-tag.outputs.version }}

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'

      - name: Build plugin
        run: |
          npm install
          npm run build

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$RELEASE_TAG"

          gh release create "$tag" \
            --title="$tag" \
            --notes-file="release-notes.md" \
            main.js manifest.json styles.css
